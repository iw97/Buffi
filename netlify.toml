# Buffi — Netlify deployment
# Next.js is built and deployed via @netlify/plugin-nextjs (OpenNext).
#
# Marketing landing lives at "/" (site root). The phone-style app shell is at
# /scan, /saves, /profile, etc. If production "looks like the app" on first load,
# open the root URL with no path, or remove any Netlify redirect that sends "/" → "/scan"
# (Site configuration → Redirects / _redirects).

[build]
  command = "npm run build"
  publish = ".next"

[context.production.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"

# Function timeout: Netlify default is 10s. For /api/scan (Claude) we need at least 15s.
# Set in Netlify UI: Site settings → Build & deploy → Continuous deployment →
# Build settings → Post processing → Functions → Function timeout (set to 15 or 26).
# On Pro, support can increase the limit to 26 seconds if needed.
